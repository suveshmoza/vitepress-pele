name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only publishes to npm, so it never needs the checkout token.
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.21.0
          runtime: node@24
          cache: false
          # Runs `pnpm install --frozen-lockfile` as part of setup.
          require-lockfile: true

      - name: Verify tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version v$version." >&2
            exit 1
          fi

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Pack
        run: pnpm pack --pack-destination .release

      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          tarballs=(.release/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball in .release, found ${#tarballs[@]}." >&2
            exit 1
          fi

          case "$TAG" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac

          # Publish the packed tarball so the published files are exactly the ones built above.
          pnpm publish "${tarballs[0]}" --tag "$tag" --access public --no-git-checks
